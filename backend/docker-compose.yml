version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: eventstay-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-eventstay}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - eventstay-network

  redis:
    image: redis:7-alpine
    container_name: eventstay-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - eventstay-network

volumes:
  postgres_data:
  redis_data:

networks:
  eventstay-network:
    driver: bridge
